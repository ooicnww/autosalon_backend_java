databaseChangeLog:

  - changeSet:
      id: 1
      author: you
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: removed
                  type: boolean
                  constraints:
                    nullable: false


  - changeSet:
      id: 2
      author: you
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: client_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: manager_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: car_id
                  type: uuid

              - column:
                  name: configuration_id
                  type: uuid

              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: removed
                  type: boolean
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: client_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_orders_client

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: manager_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_orders_manager

  - changeSet:
      id: 3
      author: you
      changes:
        - createTable:
            tableName: test_requests
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: client_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: car_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: date_time
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: removed
                  type: boolean
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableName: test_requests
            baseColumnNames: client_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_test_client

  - changeSet:
      id: 4
      author: you
      changes:
        - createTable:
            tableName: outbox_events
            columns:

              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: topic
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: processed
                  type: boolean
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false